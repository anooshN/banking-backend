apiVersion: v1
kind: Service
metadata:
  name: {{ include "loan-service.fullname" . }}
  labels:
    {{- include "loan-service.labels" . | nindent 4 }}
spec:
  type: {{ .Values.service.type }}
  selector:
    {{- include "loan-service.selectorLabels" . | nindent 4 }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.service.port }}
      protocol: TCP
