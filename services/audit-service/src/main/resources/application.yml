server:
  port: 8087
spring:
  application:
    name: audit-service
  data:
    cassandra:
      contact-points: ${CASSANDRA_HOST:localhost}
      port: ${CASSANDRA_PORT:9042}
      keyspace-name: banking_audit
      local-datacenter: datacenter1
      username: ${CASSANDRA_USERNAME:cassandra}
      password: ${CASSANDRA_PASSWORD:cassandra}
      schema-action: CREATE_IF_NOT_EXISTS
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    consumer:
      group-id: audit-service-group
      auto-offset-reset: earliest
eureka:
  client:
    service-url:
      defaultZone: http://eureka:eureka-secret@localhost:8761/eureka/
banking:
  jwt:
    secret: ${JWT_SECRET:your-256-bit-secret-key-here-minimum-32-chars}
management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
