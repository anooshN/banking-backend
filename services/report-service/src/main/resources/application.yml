server:
  port: 8088
spring:
  application:
    name: report-service
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:5432/${DB_NAME:banking_reports}
    username: ${DB_USERNAME:banking}
    password: ${DB_PASSWORD:banking-secret}
  batch:
    jdbc:
      initialize-schema: always
  jpa:
    hibernate:
      ddl-auto: update
eureka:
  client:
    service-url:
      defaultZone: http://eureka:eureka-secret@localhost:8761/eureka/
banking:
  jwt:
    secret: ${JWT_SECRET:your-256-bit-secret-key-here-minimum-32-chars}
aws:
  region: ${AWS_REGION:us-east-1}
  s3:
    bucket: ${S3_BUCKET:banking-statements}
management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
