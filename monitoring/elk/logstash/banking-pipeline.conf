input {
  beats {
    port => 5044
  }
}

filter {
  if [fields][service] {
    mutate {
      add_field => { "service_name" => "%{[fields][service]}" }
    }
  }

  # Parse Spring Boot JSON logs
  if [message] =~ /^\{/ {
    json {
      source => "message"
      target => "log"
    }
    mutate {
      rename => {
        "[log][level]"         => "log_level"
        "[log][logger_name]"   => "logger"
        "[log][message]"       => "log_message"
        "[log][correlationId]" => "correlation_id"
      }
    }
  }

  # Enrich with geo info for fraud detection
  if [clientip] {
    geoip { source => "clientip" }
  }

  # Tag slow requests
  if [duration_ms] and [duration_ms] > 1000 {
    mutate { add_tag => ["slow_request"] }
  }

  # Tag errors
  if [log_level] == "ERROR" {
    mutate { add_tag => ["error"] }
  }
}

output {
  elasticsearch {
    hosts => ["elasticsearch:9200"]
    index => "banking-logs-%{+YYYY.MM.dd}"
    document_type => "_doc"
  }

  # Send high-severity alerts to a separate index
  if "error" in [tags] {
    elasticsearch {
      hosts => ["elasticsearch:9200"]
      index => "banking-alerts-%{+YYYY.MM.dd}"
    }
  }
}
